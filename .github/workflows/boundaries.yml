name: Rebuild boundaries

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'   # quarterly, 1st day of Jan/Apr/Jul/Oct
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build from the latest Geofabrik extract (~4.2 GB download)
        run: bash scripts/boundaries/build.sh "$RUNNER_TEMP/bnd"
      - name: Update files and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/bnd/out"
          version=$(ls "$out"/ru-regions.*.geojson | sed -E 's/.*ru-regions\.([0-9-]+)\.geojson/\1/')
          current=$(grep -oE "'[0-9]{4}-[0-9]{2}'" frontend/src/map/boundariesVersion.ts | tr -d "'")
          if [ "$version" = "$current" ]; then echo "Boundaries already at $version"; exit 0; fi
          dir=frontend/public/data/boundaries
          git rm -q "$dir"/*.geojson
          cp "$out/ru-regions.$version.geojson" "$out/baikal-districts.$version.geojson" "$dir/"
          sed -i -E "s/'[0-9]{4}-[0-9]{2}'/'$version'/" frontend/src/map/boundariesVersion.ts
          branch="boundaries-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$dir" frontend/src/map/boundariesVersion.ts
          git commit -m "chore: rebuild administrative boundaries ($version)"
          git push -u origin "$branch"
          gh pr create --title "Boundaries $version" --body "Rebuilt by scripts/boundaries/build.sh from Geofabrik russia-latest ($version). New file names, so the CDN picks them up without a purge."
