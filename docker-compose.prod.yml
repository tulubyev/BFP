# forestwatch.ru — Baikal Forest Monitoring
# Запуск: docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      args:
        CDN_URL: ${CDN_URL:-}
    container_name: forestwatch-app
    restart: always
    expose:
      - "3000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.forestwatch.rule=Host(`forestwatch.ru`)"
      - "traefik.http.routers.forestwatch.entrypoints=websecure"
      - "traefik.http.routers.forestwatch.tls.certresolver=letsencrypt"
      - "traefik.http.routers.forestwatch.service=forestwatch"
      # www.forestwatch.ru → 301 → forestwatch.ru
      - "traefik.http.routers.forestwatch-www.rule=Host(`www.forestwatch.ru`)"
      - "traefik.http.routers.forestwatch-www.entrypoints=websecure"
      - "traefik.http.routers.forestwatch-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.forestwatch-www.service=forestwatch"
      - "traefik.http.routers.forestwatch-www.middlewares=forestwatch-www-redirect"
      - "traefik.http.middlewares.forestwatch-www-redirect.redirectregex.regex=^https://www\\.forestwatch\\.ru/(.*)"
      - "traefik.http.middlewares.forestwatch-www-redirect.redirectregex.replacement=https://forestwatch.ru/$${1}"
      - "traefik.http.middlewares.forestwatch-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.forestwatch.loadbalancer.server.port=3000"

  redis:
    image: redis:7-alpine
    container_name: forestwatch-redis
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", "300", "10", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
    name: forestwatch-redis-data

networks:
  traefik-public:
    name: traefik-public
    external: true
  internal:
    driver: bridge
